name: Keep worker awake

# Render free web services sleep after 15 minutes without HTTP traffic.
# Ping the worker so it keeps consuming the DM queue.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 60 --retry 3 https://openreply-worker-jabg.onrender.com/ || true
      - run: curl -fsS -m 60 https://openreply-alpha-blond.vercel.app/api/health || true
